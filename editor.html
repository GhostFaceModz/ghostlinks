<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8f6cff">
  <meta name="description" content="Build your GhostLinks page. No code.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Editor · GhostLinks">
  <meta property="og:description" content="Build your GhostLinks page. No code.">
  <meta property="og:image" content="https://ghostfacemodz.github.io/ghostlinks/assets/brand/og.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Editor · GhostLinks">
  <meta name="twitter:description" content="Build your GhostLinks page. No code.">
  <meta name="twitter:image" content="https://ghostfacemodz.github.io/ghostlinks/assets/brand/og.webp">
  <title>Editor · GhostLinks</title>
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/brand/icon-192.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="fonts/unbounded-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/looks.css">
  <link rel="stylesheet" href="css/backdrops.css">
  <script src="config.js" defer></script>
  <script type="module" src="js/boot.js"></script>
</head>
<body data-route="editor">
  <div class="land-mesh" aria-hidden="true"><span class="m1"></span><span class="m2"></span><span class="m3"></span></div>
  <div class="land-twinkle" aria-hidden="true"></div>
  <a class="skip" href="#editor-signin">Skip to sign in</a>
  <div id="app">
    <main id="editor-signin" class="notice-card editor-gate">
      <p class="eyebrow">GhostLinks</p>
      <h1>Sign in to build your page</h1>
      <p>Sign in so the page belongs to you. Everyone can still read a published page. No ads, no trackers.</p>
      <div class="auth-providers">
        <button class="auth-btn auth-google" type="button" data-provider="google">Continue with Google</button>
        <button class="auth-btn auth-discord" type="button" data-provider="discord">Continue with Discord</button>
        <button class="auth-btn auth-twitch" type="button" data-provider="twitch">Continue with Twitch</button>
        <button class="auth-btn auth-facebook" type="button" data-provider="facebook">Continue with Facebook</button>
      </div>
      <p class="auth-or"><span>or email</span></p>
      <form id="magic-link" class="auth-email-row">
        <label class="sr-only" for="magic-email">Email</label>
        <input id="magic-email" type="email" name="email" autocomplete="email" placeholder="Email" required>
        <button class="auth-btn auth-email" type="submit">Email me a magic link</button>
      </form>
      <a class="land-button land-button-quiet" href="./?u=demo">View the demo</a>
      <p id="editor-status" class="ed-status" role="status"></p>
    </main>
  </div>
  <noscript><p class="boot-note">The editor needs JavaScript.</p></noscript>
</body>
</html>
